[workspace]
resolver = "2"
members = ["mse_core", "mse_app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSE is GPL-2.0-or-later; anything ported/derived from it must stay compatible.
license = "GPL-2.0-or-later"
repository = "https://github.com/intosica/MagicSetEditor2-X11-COSMIC"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
